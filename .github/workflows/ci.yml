name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the run still in progress. Pushes
# to main always run to completion, so any commit that could later be tagged
# has a verdict from the jobs a tag push never reruns.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The offline race suite plus the real-Chromium CDP live tests; the committed
  # bundle means no Node. Only the -tags e2e suite, which needs network, runs
  # manually.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # tidy-check below loads the provider/ module graph as well.
          cache-dependency-path: |
            go.sum
            provider/go.sum
      - run: go build ./...
      # fmt-check and tidy-check cover provider/ too. compose-check is a static
      # read of compose.yaml, so it runs here once, not on each docker leg.
      - run: make fmt-check tidy-check compose-check
      - run: go vet ./...
      - run: go test -race ./...
      # Install Chrome explicitly rather than rely on the runner image. In
      # setup-chrome v2, "stable" is Chrome for Testing and floats, so a new
      # release can move these tests; pin a version if determinism matters more.
      # WAXSEAL_REQUIRE_CHROME fails on a missing browser instead of skipping.
      - id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
      - name: CDP live tests (real Chromium, pipe transport)
        env:
          WAXSEAL_CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          WAXSEAL_REQUIRE_CHROME: "1"
        run: go test -race -tags live ./internal/cdp

  # govulncheck over both modules. It reports only vulnerabilities in functions
  # the code calls, so a red run here is something to act on.
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            provider/go.sum
      - run: make vulncheck

  # The nested provider/ module. Its untagged tests are pure httptest (no
  # browser, no network); the -tags e2e files need both, so they are only
  # type-checked here.
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # This job builds in provider/, but setup-go runs at the repo root, so
          # its default cache key would ignore provider/go.sum.
          cache-dependency-path: |
            go.sum
            provider/go.sum
      - working-directory: provider
        run: go build ./... && go vet ./... && go vet -tags e2e ./... && go test -race ./...

  # Only this job runs the Windows-only code (named pipes, handle inheritance,
  # the job object, the exclusive-open profile lock); the dev box is WSL.
  # setup-chrome's stable channel has no Windows Arm build, so only the amd64
  # leg runs the live tests. -race is windows/amd64 only, so the flag is a
  # matrix value; hardcoded, the Arm leg would refuse to run.
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            live: true
            race: "-race"
          - runner: windows-11-arm
            live: false
            race: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            provider/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ${{ matrix.race }} ./...
      - name: provider offline tests
        working-directory: provider
        run: go build ./... && go vet ./... && go vet -tags e2e ./... && go test ${{ matrix.race }} ./...
      - id: setup-chrome
        if: matrix.live
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
      # The only check that the io-pipes transport drives a real browser on
      # Windows. WAXSEAL_REQUIRE_CHROME fails on a missing browser instead of
      # skipping, so the coverage cannot be lost quietly.
      - name: CDP live tests (real Chrome, io-pipes transport)
        if: matrix.live
        env:
          WAXSEAL_CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          WAXSEAL_REQUIRE_CHROME: "1"
        run: go test -race -tags live ./internal/cdp

  # Cross-compile every RELEASE_PLATFORMS target through the same `make release`
  # the release workflow runs, so a target the Makefile cannot build fails on a
  # push to main rather than on a tag.
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make release VERSION=ci

  # Rebuild the committed browser bundle and require a byte-for-byte match.
  reproduce-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: rebuild and diff against the committed bundle
        run: make verify-assets

  # Build the image on each architecture's native runner and run the offline
  # smoke test, through the same `make docker-smoke` that gates a release push.
  # The Makefile says what the probe proves and why it needs no network.
  docker:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make docker-smoke VERSION=ci
