name: Release

# Fires when a version tag is pushed. Normally a hand-written draft
# (`gh release create vX.Y.Z --draft --notes-file ...`) reserves the tag without
# creating it; publishing the draft pushes the tag and triggers this workflow,
# which attaches the binaries and publishes the image, each with a build
# provenance attestation. The tag name becomes make's VERSION, and the Makefile
# drops its leading `v`.
on:
  push:
    tags:
      - 'v*'

# Each job adds the write scopes it needs; everything else starts read-only.
permissions:
  contents: read

# A re-run for the same tag queues behind the run in progress instead of racing
# it for the same release assets and image tags.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI never sees a tag push, so this job is the gate: the tag must be on main
  # and pass the same Makefile targets a local run uses, which keeps the two
  # from drifting. A tag on a stray commit, or one whose provider pin has fallen
  # behind the root, stops here before anything publishes.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history is what brings refs/remotes/origin/main with it.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Uncached like the binaries job: nothing restored from an earlier run
          # gets to decide whether a release goes out.
          cache: false
      # HEAD, not the event SHA: an annotated tag points at the tag object, and
      # the checkout has already resolved that to the commit.
      - name: the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; nothing will be published"
            exit 1
          fi
      - name: gates
        run: make fmt-check tidy-check vet test consumer-check

  # Build the version-stamped binaries (the Makefile's RELEASE_PLATFORMS) and
  # attach them, with SHA256SUMS, to the tag's release, which normally already
  # exists with hand-written notes and keeps them. A tag pushed straight with
  # `git push` gets an empty draft for a human to write up and publish; this
  # workflow never publishes a release on its own.
  binaries:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # upload the assets, and create the fallback draft
      id-token: write      # sign the attestation as this workflow
      attestations: write  # store the attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release builds from clean module and build caches, so nothing
          # restored from an earlier run can reach a published binary.
          cache: false
      - name: build release binaries
        run: make release VERSION="$GITHUB_REF_NAME"
      # Not a pipe into tee: a run step with no shell set runs `bash -e` without
      # pipefail, which would let a sha256sum failure pass as tee's success.
      - name: checksums
        working-directory: dist
        run: |
          sha256sum waxseal-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          { echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: publish binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft does not own its tag, so `gh release create --draft`
          # succeeds even when another release uses the tag, leaving an empty
          # duplicate; hence the guard. The lookup avoids `gh release view`: the
          # releases endpoint lists drafts too, and --paginate reads every page,
          # so a re-run cannot add a second draft. No `|| true`: a failed create
          # leaves the upload nowhere to go.
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | .id')
          if [ -z "$existing" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --draft --notes "" --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/waxseal-* dist/SHA256SUMS.txt --clobber
      # Provenance for every binary: the commit, workflow, and runner that built
      # it. `gh attestation verify <file> --repo ColeSpringer/WaxSeal` checks a
      # download against it.
      - name: attest the binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/waxseal-*

  # Each native runner builds, smoke-tests, and pushes its per-arch tag with
  # `make docker-push-authed`, since the Actions token cannot pass docker-push's
  # gh OAuth scope check. CI never sees a tag push and this build installs
  # chromium fresh, so this smoke test is the only proof the image starts.
  image:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read       # check out the source
      packages: write      # push the per-arch tag to GHCR, and its attestation beside it
      id-token: write      # sign the attestation as this workflow
      attestations: write  # store the attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: build, smoke-test, and push the per-arch tag
        run: make docker-push-authed VERSION="$GITHUB_REF_NAME"
      # A per-arch tag resolves to its own manifest, not to the multi-arch one the
      # manifest job attests, so a pull pinned to one platform gets its own
      # attestation here. The Makefile names the image and the tag, so the
      # workflow cannot attest a different reference than it pushed.
      - name: resolve the pushed digest
        id: pushed
        run: |
          echo "name=$(make -s image-name)" >> "$GITHUB_OUTPUT"
          echo "digest=$(make -s docker-digest VERSION="$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - name: attest the per-arch image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.pushed.outputs.name }}
          subject-digest: ${{ steps.pushed.outputs.digest }}
          push-to-registry: true

  # Assemble the plain VERSION tag from the per-arch tags and, for a stable
  # release, move :latest. A tag with a semver prerelease suffix (v1.2.0-rc1) is
  # published under its own tag but never repoints :latest. The make target
  # fails unless every architecture made it into the manifest.
  manifest:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read       # check out the Makefile
      packages: write      # push the VERSION and :latest manifests, and the attestation beside them
      id-token: write      # sign the attestation as this workflow
      attestations: write  # store the attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: assemble the multi-arch tag
        run: |
          # Build metadata after + can contain hyphens and is not a prerelease; strip it first.
          case "${GITHUB_REF_NAME%%+*}" in
            *-*) push_latest=0; echo "prerelease $GITHUB_REF_NAME; :latest will not be moved" ;;
            *)   push_latest=1 ;;
          esac
          # Already logged in above; docker-manifest's docker-login would reject
          # the Actions token.
          make docker-manifest-authed VERSION="$GITHUB_REF_NAME" PUSH_LATEST="$push_latest"
      # The attestation names the multi-arch manifest, which is what the VERSION
      # tag and :latest both resolve to, so it lives with the job that assembles
      # it. `gh attestation verify oci://ghcr.io/colespringer/waxseal:<version>
      # --repo ColeSpringer/WaxSeal` checks a pull against it.
      - name: resolve the manifest digest
        id: manifest
        run: |
          echo "name=$(make -s image-name)" >> "$GITHUB_OUTPUT"
          echo "digest=$(make -s docker-manifest-digest VERSION="$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - name: attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
