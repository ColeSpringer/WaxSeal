name: Release

# Fires when a version tag is pushed. The normal flow is to write the notes by
# hand into a draft (`gh release create vX.Y.Z --draft --notes-file ...`), which
# reserves the tag without creating it, and then publish: publishing is what
# pushes the tag and triggers this workflow, whose jobs attach the binaries and
# publish the image. VERSION strips the leading `v` so it matches the image tag
# and the -X main.version stamp (v1.2.3 -> 1.2.3).
on:
  push:
    tags:
      - 'v*'

jobs:
  # Build the version-stamped Linux and macOS binaries and attach them, plus a
  # SHA256SUMS manifest, to the release for the tag. Normally the release is
  # already there, published by hand with written notes, and it keeps its body
  # and just gains the assets. Only if none exists (a tag pushed straight with
  # `git push`) is one created here, as a draft with an empty body, so a human
  # writes the notes and publishes it; this workflow never publishes a release
  # on its own. The binaries embed the committed JS bundle but need a system
  # Chromium at runtime.
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build release binaries
        run: make release VERSION="${GITHUB_REF_NAME#v}"
      - name: checksums
        working-directory: dist
        run: sha256sum waxseal-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: publish binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The create has to be guarded rather than run unconditionally behind
          # `|| true`. A draft release does not own its tag, so the API accepts
          # a second draft carrying a tag name another release already uses, and
          # `gh release create --draft` therefore succeeds against an existing
          # release instead of failing. Unguarded, it left an empty duplicate
          # draft beside the real v1.2.0. The pre-1.2.0 spelling of this step
          # was not --draft, so the create did fail and `|| true` was enough.
          #
          # The count comes from `gh release list` rather than `gh release
          # view`: list reports drafts as well as published releases, so a
          # re-run of this job cannot pile a second draft onto one it created
          # earlier. Nothing here swallows a failure any more, since a create
          # that fails leaves the upload below nowhere to put the assets.
          existing=$(gh release list --limit 100 --json tagName \
            --jq '[.[] | select(.tagName == env.GITHUB_REF_NAME)] | length')
          if [ "$existing" -eq 0 ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --draft --notes "" --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/waxseal-* dist/SHA256SUMS.txt --clobber

  # Build and push the runtime image (VERSION and, for a stable release,
  # latest) to GHCR with the built-in token. This does not reuse `make
  # docker-push`: that target's login and scope checks are written for a
  # human's gh OAuth token, which the Actions GITHUB_TOKEN is not, and `make
  # docker-build` has no such checks. Bypassing `make docker-push` also
  # bypasses its `PUSH_LATEST` guard (Makefile), so the push step below
  # reimplements that gate directly: `:latest` moves only when the tag's
  # version has no semver prerelease suffix, so a release candidate such as
  # v1.2.0-rc1 is pushed under its own tag but never repoints the public
  # `:latest`. Single platform (linux/amd64), matching the manual release; add
  # buildx for multi-arch later.
  #
  # The same image smoke test the CI workflow runs sits between the build and
  # the first push. CI never sees a tag push, and this build resolves
  # `apt-get install chromium` fresh, so without the probe here a release
  # could publish an image that no run of any workflow ever started.
  # `--pull=never` on the probe keeps it honest: the image under test can only
  # be the one `make docker-build` just produced, never a same-tagged image
  # pulled back down from GHCR now that this job is logged in.
  image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub Actions expressions have no substring-strip function, so VERSION
      # cannot be a job-level env: value computed with ${{ }}; compute it once in
      # a shell step instead and export it to every later step in the job.
      - name: compute VERSION
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: build the image
        run: make docker-build VERSION="$VERSION"
      - name: the built image can start a renderer and complete a navigation
        run: |
          docker run --rm --network none --shm-size=1gb --pull=never \
            --entrypoint waxseal "ghcr.io/colespringer/waxseal:$VERSION" \
            doctor --stop-after-load
      - name: push
        run: |
          docker push "ghcr.io/colespringer/waxseal:$VERSION"
          # Build metadata after + can contain hyphens and is not a prerelease; strip it first.
          case "${VERSION%%+*}" in
            *-*) echo "prerelease $VERSION; :latest not moved" ;;
            *)   docker push "ghcr.io/colespringer/waxseal:latest" ;;
          esac
